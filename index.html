<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'; connect-src 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Codabar Lens</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script src="nw7-core.js" defer></script>
  <script src="messages.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="page-header">
    <div class="language-row"><button id="lang-toggle" type="button"></button></div>
    <h1>Codabar Lens</h1>
    <p data-i18n="header.description"></p>
  </header>
  <noscript>
    <p lang="ja">Codabar Lensを使うにはJavaScriptを有効にしてください。</p>
    <p lang="en">Enable JavaScript to use Codabar Lens.</p>
  </noscript>
  <main>
    <p data-i18n="related.description"></p>
    <a href="https://ipusiron.github.io/postmirror/" target="_blank" rel="noopener noreferrer" data-i18n="related.postmirror"></a>
    <div class="tabs" role="tablist" data-i18n-label="tabs.label">
      <button id="tab-photo" type="button" role="tab" aria-selected="true" aria-controls="panel-photo" data-i18n="tab.photo"></button>
      <button id="tab-learn" type="button" role="tab" aria-selected="false" aria-controls="panel-learn" tabindex="-1" data-i18n="tab.learn"></button>
    </div>
    <div id="panel-photo" role="tabpanel" aria-labelledby="tab-photo">
      <section aria-labelledby="photo-title">
        <h2 id="photo-title" data-i18n="photo.title"></h2>
        <p id="photo-own" data-i18n="photo.own"></p>
        <p id="photo-format" data-i18n="nw7.format"></p>
        <p class="privacy" data-i18n="photo.privacy"></p>
        <details class="photo-help" open>
          <summary data-i18n="photo.helpTitle"></summary>
          <figure id="photo-nw7-example" class="photo-example">
            <div class="photo-nw7-bars" role="img" data-i18n-label="nw7.exampleLabel">
              <span></span><span></span><span></span><span></span><span></span>
              <span></span><span></span><span></span><span></span><span></span>
            </div>
            <div class="photo-example-ends" aria-hidden="true">
              <span data-i18n="photo.leftEnd"></span><span data-i18n="photo.rightEnd"></span>
            </div>
            <figcaption data-i18n="nw7.tapBand"></figcaption>
          </figure>
          <p id="photo-taps" data-i18n="nw7.fourTaps"></p>
        </details>
        <label for="photo-file" data-i18n="photo.file"></label>
        <input id="photo-file" type="file" accept="image/jpeg,image/png,image/webp" aria-describedby="photo-own photo-format photo-keyboard">
        <p id="photo-keyboard" class="muted" data-i18n="nw7.keyboard"></p>
        <ol id="photo-progress" class="photo-progress" hidden>
          <li data-i18n="photo.progress.1"></li><li data-i18n="photo.progress.2"></li>
          <li data-i18n="photo.progress.3"></li><li data-i18n="photo.progress.4"></li>
        </ol>
        <div aria-live="polite">
          <p id="photo-notice"></p>
          <p id="photo-step" class="photo-step"></p>
          <p id="photo-position" class="muted"></p>
        </div>
        <div id="photo-work" hidden>
          <canvas id="photo-overview" class="photo-canvas" width="0" height="0" role="img"></canvas>
          <canvas id="photo-zoom" class="photo-canvas" width="0" height="0" role="img" hidden></canvas>
          <section id="photo-output" aria-labelledby="photo-result-title" hidden>
            <h3 id="photo-result-title" tabindex="-1" data-i18n="lab.result"></h3>
            <div id="photo-result-wrap" class="photo-result-wrap" tabindex="0" role="region" data-i18n-label="nw7.resultImage">
              <canvas id="photo-result" width="0" height="0" role="img"></canvas>
            </div>
            <div aria-live="polite">
              <p id="photo-status"></p>
              <div id="photo-failure" hidden>
                <p id="photo-not-decoded" data-i18n="nw7.notDecoded"></p>
                <p id="photo-failure-help" data-i18n="nw7.failureHelp"></p>
                <p data-i18n="image.otherMethods"></p>
              </div>
              <div id="photo-nw7-output" hidden>
                <h4 data-i18n="nw7.resultTitle"></h4>
                <p id="photo-nw7-value" class="barcode-value" dir="ltr"></p>
                <p id="photo-nw7-guards"></p>
                <p data-i18n="nw7.resultHelp"></p>
              </div>
            </div>
          </section>
          <div class="photo-actions">
            <button id="photo-back" type="button" data-i18n="photo.back" disabled></button>
            <button id="photo-reselect" type="button" data-i18n="photo.reselect" disabled></button>
          </div>
        </div>
        <button id="photo-clear" type="button" data-i18n="photo.clear" disabled></button>
      </section>
    </div>
    <div id="panel-learn" role="tabpanel" aria-labelledby="tab-learn" hidden>
      <section id="learn-nw7" aria-labelledby="learn-nw7-title">
        <h2 id="learn-nw7-title" data-i18n="nw7.learn.title"></h2>
        <p data-i18n="nw7.learn.intro"></p>
        <h3 data-i18n="nw7.learn.shapesTitle"></h3>
        <p data-i18n="nw7.learn.shapes"></p>
        <p data-i18n="nw7.learn.characters"></p>
        <h3 data-i18n="nw7.learn.resultTitle"></h3>
        <p data-i18n="nw7.learn.example"></p>
        <p data-i18n="nw7.learn.result"></p>
        <p data-i18n="nw7.learn.check"></p>
        <h3 data-i18n="nw7.learn.tryTitle"></h3>
        <p data-i18n="nw7.fourTaps"></p>
        <p data-i18n="nw7.tapBand"></p>
        <p data-i18n="nw7.learn.privacy"></p>
        <button id="nw7-open-photo" type="button" data-i18n="nw7.learn.openPhoto"></button>
        <h3 data-i18n="nw7.learn.limitsTitle"></h3>
        <p data-i18n="nw7.learn.limits"></p>
        <p data-i18n="nw7.learn.failure"></p>
        <h3 data-i18n="nw7.learn.sourcesTitle"></h3>
        <p><a href="https://barcodeguide.seagullscientific.com/Content/Symbologies/Codabar.htm" target="_blank" rel="noopener noreferrer" data-i18n="nw7.learn.sourceStructure"></a></p>
        <p><a href="https://docs.strich.io/codabar.html" target="_blank" rel="noopener noreferrer" data-i18n="nw7.learn.sourceCheck"></a></p>
      </section>
    </div>
    <p id="language-announcement" class="sr-only" aria-live="polite"></p>
  </main>
  <footer>
    <p data-i18n="footer.independent"></p>
    <p data-i18n="footer.intent"></p>
    <p>
      <a href="https://github.com/ipusiron/codabar-lens" target="_blank" rel="noopener noreferrer" data-i18n="footer.github"></a>
    </p>
  </footer>
</body>
</html>
